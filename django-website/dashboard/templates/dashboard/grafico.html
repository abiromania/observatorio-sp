{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Observatório de Segurança</title>
    <link rel="stylesheet" href="{% static 'style.css' %}"> 
</head>
<body>
    <h1>Observatório de Criminalidades - SP</h1>

        <!-- Indicadores -->
         {{total}}


        <!-- Gráficos -->
        <div class="filtros-container">
            <a href="{% url 'dashboard' %}?natureza=Sem Filtro">
                <button class="botao">Sem Filtro</button>
            </a>

            <a href="{% url 'dashboard' %}?natureza=FURTO">
                <button class="botao">Furto</button>
            </a>

            <a href="{% url 'dashboard' %}?natureza=ROUBO">
                <button class="botao">Roubo</button>
            </a>

            <a href="{% url 'dashboard' %}?natureza=LESAO CORPORAL DOLOSA">
                <button class="botao">Lesão Corporal</button>
            </a>

            <a href="{% url 'dashboard' %}?natureza=FURTO DE VEICULO">
                <button class="botao">Furto de Veículo</button>
            </a>

            <a href="{% url 'dashboard' %}?natureza=FURTO DE VEICULO">
                <button class="botao">Sinistro de Trânsito</button>
            </a>
        </div>


    <!-- Gráficos lado a lado -->
    <div class="graficos-container">
        <div style="flex: 1 1 300px; min-width: 45%; max-width: 50%;">
            {{ fig_mapa|safe }}
        </div>
        <div style="flex: 1 1 300px; min-width: 45%; max-width: 50%;">
            {{ fig_bairro|safe }}
        </div>
    </div>

    <!-- Gráfico de barras - Hora (abaixo) -->
    <div class='graficos-container'>
        <div style="flex: 1 1 300px; min-width: 45%; max-width: 50%;">
            {{ fig_hora|safe }}
        </div>
        <div style="flex: 1 1 300px; min-width: 45%; max-width: 50%;">
            {{ fig_data|safe }}
    </div>




</body>
</html>
