{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Observatório de Segurança</title>
    <link rel="stylesheet" href="{% static 'style.css' %}"> 
</head>
<body>
    <h1>Observatório de Criminalidades - SP</h1>

        <!-- Filtros -->
        <a href="{% url 'dashboard' %}?natureza=Sem Filtro">
            <button>Sem Filtro</button>
        </a>

        <a href="{% url 'dashboard' %}?natureza=FURTO">
            <button>Furto</button>
        </a>

        <a href="{% url 'dashboard' %}?natureza=ROUBO">
            <button>Roubo</button>
        </a>

        <a href="{% url 'dashboard' %}?natureza=LESAO CORPORAL DOLOSA">
            <button>Lesão Corporal</button>
        </a>

        <a href="{% url 'dashboard' %}?natureza=FURTO DE VEICULO">
            <button>Furto de Veículo</button>
        </a>

        <a href="{% url 'dashboard' %}?natureza=FURTO DE VEICULO">
            <button>Sinistro de Trânsito</button>
        </a>



    <!-- Gráficos lado a lado -->
    <div class="graficos-container">
        <div style="flex: 1 1 350px; min-width: 48%; max-width: 50%;">
            {{ fig_bairro|safe }}
        </div>
        <div style="flex: 1 1 350px; min-width: 48%; max-width: 50%;">
            {{ fig_mapa|safe }}
        </div>
    </div>

    <!-- Gráfico de barras - Hora (abaixo) -->
    <div style="margin-top: 32px;">
        {{ fig_hora|safe }}
    </div>




</body>
</html>
